services:
  db:
    ports:
      - "127.0.0.1:5433:5432"
  api:
    environment:
      - ENABLE_DOCS=1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/graphs:/app/graphs
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
  web:
    ports:
      - "8080:80"
