# Compose racine : orchestre toute la stack (db + api + front web).
# Nom de projet épinglé pour rester stable quel que soit le dossier d'appel.
name: secu_cycle

services:
  db:
    container_name: secu_cycle_db
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 5

  api:
    container_name: fastapi_api
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  web:
    container_name: secu_cycle_web
    profiles: ["web"]
    build: ./frontend-web
    depends_on:
      - api

volumes:
  postgres_data:
    # Volume géré hors compose : on réutilise l'existant (créé sous l'ancien
    # projet "backend") pour conserver les données de prod. `external` évite
    # que compose tente de le (re)créer/labelliser et supprime le warning.
    external: true
    name: backend_postgres_data
