# Compose racine : orchestre toute la stack (db + api + front web).
# Nom de projet épinglé pour rester stable quel que soit le dossier d'appel.
name: secu_cycle

services:
  db:
    container_name: secu_cycle_db
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 5

  api:
    container_name: fastapi_api
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - GRAPH_PROFILE=${GRAPH_PROFILE}
      - DATA_PROFILE=${DATA_PROFILE:-}
      - ROUTE_CACHE_SIZE=${ROUTE_CACHE_SIZE:-256}
      - MAPTILER_KEY=${MAPTILER_KEY:-}
      - MAPTILER_GEOCODING_BUDGET=${MAPTILER_GEOCODING_BUDGET:-40000}
      - GEOCODE_CACHE_TTL_DAYS=${GEOCODE_CACHE_TTL_DAYS:-365}
      - WAQI_TOKEN=${WAQI_TOKEN:-}
      - BIKESHARE_ENABLED=${BIKESHARE_ENABLED:-1}
      - BIKESHARE_TBM_API_KEY=${BIKESHARE_TBM_API_KEY:-}
      - WEATHER_ENABLED=${WEATHER_ENABLED:-1}
      - OPEN_METEO_URL=${OPEN_METEO_URL:-}
      - OPEN_METEO_API_KEY=${OPEN_METEO_API_KEY:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - graphs_data:/app/graphs
    depends_on:
      db:
        condition: service_healthy

  web:
    container_name: secu_cycle_web
    profiles: ["web"]
    build: ./frontend-web
    depends_on:
      - api

volumes:
  graphs_data:
  postgres_data:
    # Volume géré hors compose : on réutilise l'existant (créé sous l'ancien
    # projet "backend") pour conserver les données de prod. `external` évite
    # que compose tente de le (re)créer/labelliser et supprime le warning.
    external: true
    name: backend_postgres_data
