name: CodeQL

# SAST natif GitHub. Les résultats apparaissent dans l'onglet Security > Code
# scanning. Gratuit pour les dépôts publics ; pour un dépôt privé il faut GitHub
# Advanced Security (sinon ce workflow échoue et peut être retiré).

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "30 6 * * 1"  # lundi 6h30

jobs:
  analyze:
    name: Analyse (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
      - name: Analyser
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
