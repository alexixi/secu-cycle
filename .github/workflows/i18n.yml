name: Internationalisation

# L'internationalisation échoue *silencieusement* : une clé absente est servie
# telle quelle, une chaîne oubliée reste en français sur une page anglaise, et
# rien ne lève. Les deux plateformes ont donc chacune leur filet — ce workflow
# est le seul endroit où ils bloquent réellement une fusion.

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend-web/src/**"
      - "frontend-web/scripts/check-i18n.mjs"
      - "frontend-mobile/app/**"
      - "frontend-mobile/components/**"
      - "frontend-mobile/context/**"
      - "frontend-mobile/hooks/**"
      - "frontend-mobile/services/**"
      - "frontend-mobile/constants/**"
      - "frontend-mobile/utils/**"
      - "frontend-mobile/i18n/**"
      - "frontend-mobile/modules/**"
      - "frontend-mobile/scripts/check-i18n.mjs"
      - ".github/workflows/i18n.yml"
  push:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "frontend-web/src/**"
      - "frontend-web/scripts/check-i18n.mjs"
      - "frontend-mobile/app/**"
      - "frontend-mobile/components/**"
      - "frontend-mobile/context/**"
      - "frontend-mobile/hooks/**"
      - "frontend-mobile/services/**"
      - "frontend-mobile/constants/**"
      - "frontend-mobile/utils/**"
      - "frontend-mobile/i18n/**"
      - "frontend-mobile/modules/**"
      - "frontend-mobile/scripts/check-i18n.mjs"
      - ".github/workflows/i18n.yml"

permissions:
  contents: read

jobs:
  api:
    name: Catalogues de l'API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Parité des catalogues fr/en
        run: python -m i18n.check

      # La suite ne porte que sur des fonctions pures (ni base, ni graphe) : elle
      # couvre la règle ordinale, les clés composées dynamiquement et l'absence
      # de libellé rendu dans le cache d'itinéraires, qu'aucun contrôle statique
      # ne peut vérifier.
      - name: Tests d'internationalisation
        run: python -m pytest tests/ -q

  web:
    name: Catalogues et littéraux du front web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pas de `npm ci` : le contrôle n'importe que des modules natifs de Node et
      # deux fichiers du dépôt. L'installation coûterait une minute pour rien.
      - name: Parité, registres, littéraux français en dur, formateurs figés
        run: node scripts/check-i18n.mjs

  mobile:
    name: Catalogues et littéraux de l'application mobile
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pas de `npm ci`, pour la même raison que le web, et une de plus :
      # installer les dépendances d'Expo pour lire du texte tirerait React Native
      # et i18next. Le contrôle n'ouvre que des fichiers du dépôt avec node:fs.
      - name: Parité, clés appelées, littéraux français en dur, locales et voix figées
        run: node scripts/check-i18n.mjs
