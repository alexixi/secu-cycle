# ⚠️ Ce fichier ne décrit PLUS la production : Coolify construit chaque brique
# comme une ressource distincte à partir de son `Dockerfile` et ignore ce
# compose (voir README, « Organisation dans Coolify »). Ce qui gouverne la prod
# est donc `backend/Dockerfile` — d'où le `command:` ci-dessous, recopié de son
# `CMD` — et l'UI Coolify pour tout le reste, limites mémoire comprises.
# Ce fichier ne sert plus qu'à `make prod`, conservé en secours.

services:
  api:
    # 1 seul worker en prod : chaque worker charge sa propre copie du graphe
    # bordeaux (~0,5-1 Go en mémoire). Avec 3 workers sur un VPS 3,8 Go sans
    # swap, le pic de chargement saturait la RAM et déclenchait l'OOM killer,
    # rendant l'hôte injoignable. Le calcul d'itinéraire étant déporté hors de
    # l'event loop (asyncio.to_thread), 1 worker async reste réactif.
    # --proxy-headers/--forwarded-allow-ips : voir le Dockerfile. Nécessaire pour
    # que le rate-limiting voie la vraie IP client (X-Forwarded-For du proxy).
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "127.0.0.1:8000:8000"
  web:
    ports:
      - "127.0.0.1:8080:80"
