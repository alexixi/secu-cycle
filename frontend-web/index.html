<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 https://api.secu-cycle.fr https://*.maptiler.com https://api-adresse.data.gouv.fr https://analytics.secu-cycle.fr;
                 img-src 'self' data: blob: https://*.maptiler.com;
                 worker-src 'self' blob:;
                 script-src 'self' https://analytics.secu-cycle.fr;
                 style-src 'self' 'unsafe-inline';
                 font-src 'self' data: https://*.maptiler.com;
                 object-src 'none';
                 base-uri 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#646cff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sécu'Cycle" />
    <meta name="keywords" content="vélo, sécurité, itinéraires, gps, cyclisme, trajets, mobilité douce, Bordeaux" />
    <meta name="author"
        content="Alexis Gaudray Bouju, Matheline Chevalier, Khaoula Najmeddine, Angelo Thunney, Joan Dumarchat, Léia Daragnès" />

    <link rel="preconnect" href="https://api.secu-cycle.fr" />
    <link rel="preconnect" href="https://api.maptiler.com" crossorigin />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "Sécu'Cycle",
          "url": "https://secu-cycle.fr",
          "description": "Calculez des itinéraires à vélo sécurisés et adaptés à votre profil, votre vélo et le type de route. Données temps réel de trafic sur la métropole de Bordeaux.",
          "applicationCategory": "TravelApplication",
          "operatingSystem": "Web",
          "inLanguage": "fr",
          "areaServed": {
            "@type": "City",
            "name": "Bordeaux Métropole"
          },
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "EUR"
          },
          "publisher": { "@id": "https://secu-cycle.fr/#organization" }
        },
        {
          "@type": "Organization",
          "@id": "https://secu-cycle.fr/#organization",
          "name": "Sécu'Cycle",
          "url": "https://secu-cycle.fr",
          "logo": "https://secu-cycle.fr/apple-touch-icon.png"
        }
      ]
    }
    </script>

    <script defer src="https://analytics.secu-cycle.fr/script.js"
        data-website-id="%VITE_UMAMI_WEBSITE_ID%"
        data-domains="secu-cycle.fr,www.secu-cycle.fr"></script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
